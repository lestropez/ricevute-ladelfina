<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B79935">
<title>Lestropez Spese</title>
<link rel="manifest" href="manifest.webmanifest?v=6">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1b2430;--mut:#6b7686;--pri:#8f7625;--ok:#1e7a46;--warn:#9a6a00;--err:#b3261e;--line:#dfe4ea}
@media (prefers-color-scheme:dark){:root{--bg:#11161d;--card:#1a212b;--ink:#e8edf3;--mut:#9aa6b5;--pri:#c9ad55;--line:#2c3542}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:90px}
header{background:#B79935;color:#fff;padding:14px 16px calc(14px) 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:13px}
main{padding:12px 16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.mut{color:var(--mut);font-size:13px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:10px;border:0;background:transparent;color:var(--ink);font-size:15px}
.seg button.on{background:var(--pri);color:#fff}
.grid{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;display:flex;gap:10px;padding:10px}
.item .thumb{flex:0 0 96px;position:relative}
.item img,.item .pdf{width:96px;height:140px;object-fit:cover;display:block;background:#ddd;border-radius:8px}
.item .pdf{display:flex;align-items:center;justify-content:center;font-weight:700;color:#555}
.item .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding-right:26px}
.item input,.item select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:15px;background:var(--bg);color:var(--ink)}
.item .chi{border-color:var(--pri)}
.item .who{align-self:flex-start;padding:3px 10px;border-radius:8px;background:var(--line);font-size:13px;cursor:pointer}
.item .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:50%;width:28px;height:28px;font-size:16px}
.badge{position:absolute;top:4px;left:4px;padding:2px 6px;border-radius:6px;font-size:11px;color:#fff}
.b-up{background:var(--warn)}.b-ok{background:var(--ok)}.b-err{background:var(--err)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;max-width:640px;margin:0 auto}
.btn{padding:11px 6px;border-radius:12px;text-align:center;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;font-weight:600}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn:disabled{opacity:.5}
.empty{text-align:center;padding:30px 10px}
.empty ol{text-align:left;display:inline-block;margin:10px 0 0;padding-left:20px}
#log{white-space:pre-wrap;font-size:12px}
.hidden{display:none}
.item canvas.pdfc{width:96px;height:auto;max-height:140px;display:block;background:#fff;border-radius:8px;border:1px solid var(--line)}
.item .fname{font-size:10px;color:var(--mut);word-break:break-all;max-height:28px;overflow:hidden;margin-top:2px}
.item .thumb{cursor:zoom-in}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:flex;flex-direction:column}
.viewer .vbar{background:#000;display:flex;align-items:center;gap:10px;padding:10px 12px;color:#fff;font-size:13px}
.viewer .vbar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer .vbar button{background:#fff;color:#000;border:0;border-radius:8px;padding:8px 14px;font-weight:600}
.viewer .vbody{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;align-items:center;gap:8px}
.viewer .vbody img,.viewer .vbody canvas{max-width:100%;background:#fff}
.viewer .vbody p{color:#fff}
</style>
</head>
<body>
<header>
  <h1 style="letter-spacing:.35em;font-weight:500">LESTROPEZ <span style="font-size:11px;letter-spacing:.25em;opacity:.9">SPESE</span></h1>
  <button id="acct">Accedi</button>
</header>
<main>
  <div class="card">
    <div class="mut" style="margin-bottom:6px">Chi ha pagato (vale per le nuove foto)</div>
    <div class="seg" id="persons"></div>
  </div>

  <div id="empty" class="card empty">
    <b>Nessuna ricevuta in coda</b>
    <ol class="mut">
      <li>Fotografa con la fotocamera in modalità <b>Documento</b></li>
      <li>Apri la Galleria, tieni premuto e seleziona più foto (oppure usa il pulsante <b>Foto</b> qui sotto)</li>
      <li><b>Condividi</b> → <b>Spese</b></li>
      <li>Controlla e premi <b>Invia</b></li>
    </ol>
  </div>

  <div class="grid" id="grid"></div>

  <div class="card hidden" id="logcard"><div id="log"></div></div>
  <p class="mut" id="dest" style="text-align:center"></p>
</main>
<div class="bar">
  <label class="btn">Foto
    <input id="pick" type="file" accept="image/*" multiple hidden>
  </label>
  <label class="btn">PDF
    <input id="pickpdf" type="file" accept="application/pdf" multiple hidden>
  </label>
  <button class="btn pri" id="send" disabled>Invia</button>
</div>
<script src="config.js?v=7"></script>
<script src="msal-browser.min.js"></script>
<script src="app.js?v=7"></script>
</body>
</html>
